<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TaskFlow – Priority Task Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#14171f;--mu:#667085;--ac:#1f3a5f;--bd:#e3e6ee;--hi:#d92d20;--md:#dc6803;--lo:#079455;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#181c25;--tx:#eef0f5;--mu:#9aa3b5;--ac:#7aa2e3;--bd:#2a3040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#181c25;--tx:#eef0f5;--mu:#9aa3b5;--ac:#7aa2e3;--bd:#2a3040;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}h1{font-size:1.6rem;margin:0}p.s{color:var(--mu);margin:4px 0 16px}
form{display:flex;gap:8px;flex-wrap:wrap}input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input{flex:1 1 180px}button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500;padding:6px 12px}.tabs button.on{background:var(--ac);color:#fff}
ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
li span.t{flex:1;word-break:break-word}li.done span.t{text-decoration:line-through;color:var(--mu)}
.b{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor}.High{color:var(--hi)}.Medium{color:var(--md)}.Low{color:var(--lo)}
li button.x{background:none;color:var(--mu);padding:4px 8px;font-size:1.1rem}.empty{color:var(--mu);text-align:center;padding:24px}.cnt{color:var(--mu);font-size:.9rem;margin-top:12px}
</style></head><body><main>
<h1>TaskFlow</h1><p class="s">A small priority-based task tracker. Tasks stay saved in your browser.</p>
<form id="f"><input id="in" placeholder="What needs doing?" maxlength="120" aria-label="New task" required>
<select id="pr" aria-label="Priority"><option>High</option><option selected>Medium</option><option>Low</option></select><button>Add</button></form>
<div class="tabs" id="tabs"></div><ul id="ls"></ul><p class="cnt" id="ct"></p></main>
<script>
var tasks=[],filter="All",KEY="taskflow.v1";
try{tasks=JSON.parse(localStorage.getItem(KEY)||"[]")||[]}catch(e){tasks=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function render(){
 var order={High:0,Medium:1,Low:2};
 var vis=tasks.filter(function(t){return filter==="All"||(filter==="Active"&&!t.done)||(filter==="Done"&&t.done)})
  .sort(function(a,b){return a.done-b.done||order[a.p]-order[b.p]});
 document.getElementById("tabs").innerHTML=["All","Active","Done"].map(function(n){return '<button class="'+(n===filter?"on":"")+'" data-f="'+n+'">'+n+'</button>'}).join("");
 document.getElementById("ls").innerHTML=vis.length?vis.map(function(t){return '<li class="'+(t.done?"done":"")+'"><input type="checkbox" '+(t.done?"checked":"")+' data-c="'+t.id+'" aria-label="Mark done" style="flex:none"><span class="t">'+esc(t.t)+'</span><span class="b '+t.p+'">'+t.p+'</span><button class="x" data-x="'+t.id+'" aria-label="Delete">×</button></li>'}).join(""):'<li class="empty" style="justify-content:center">Nothing here yet.</li>';
 var left=tasks.filter(function(t){return !t.done}).length;
 document.getElementById("ct").textContent=left+" active · "+(tasks.length-left)+" done";
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();var i=document.getElementById("in"),v=i.value.trim();if(!v)return;
 tasks.push({id:Date.now()+Math.random(),t:v,p:document.getElementById("pr").value,done:false});i.value="";save();render()});
document.addEventListener("click",function(e){var d=e.target.dataset;
 if(d.f){filter=d.f;render()}
 if(d.x){tasks=tasks.filter(function(t){return String(t.id)!==d.x});save();render()}});
document.addEventListener("change",function(e){var c=e.target.dataset.c;if(c){tasks.forEach(function(t){if(String(t.id)===c)t.done=e.target.checked});save();render()}});
render();
</script></body></html>
